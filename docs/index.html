<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>죽음의 멀리갈리</title>
<meta property="og:title" content="죽음의 멀리갈리" />
<meta property="og:description" content="멀리갈리로 갈 때까지 가보기 — MK와 아이들" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>" />
<style>
  :root{
    --bg0:#070b1a; --bg1:#0d1836; --bg2:#152a5c;
    --gold:#ffd76b; --gold2:#ffb03a; --ink:#f6f4ef; --muted:#a9b4d0;
    --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
    --accent:#ff5d8f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 90% at 50% -10%, var(--bg2), var(--bg1) 45%, var(--bg0) 100%);
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .wrap{max-width:560px;margin:0 auto;position:relative}

  /* ---------------- INTRO / ANIMATION ---------------- */
  /* 한강공원 저녁 노을 하늘 */
  #intro{position:fixed;inset:0;z-index:50;overflow:hidden;
    background:linear-gradient(180deg,#243063 0%, #3c4a86 18%, #6b5c9e 36%, #b06f92 50%, #e2926f 60%, #f4c98c 67%);}
  #intro.done{opacity:0;pointer-events:none;transition:opacity .8s ease}
  /* 강 건너 도시 실루엣 + 불빛 */
  .skyline{position:absolute;left:0;right:0;top:50%;height:8%;z-index:1;
    background:linear-gradient(180deg, rgba(24,28,58,0), #1a2447 70%);
    -webkit-mask:linear-gradient(180deg,transparent,#000 55%);mask:linear-gradient(180deg,transparent,#000 55%)}
  .bokeh{position:absolute;left:0;right:0;top:55%;height:22px;filter:blur(.4px);opacity:.95;z-index:2}
  .bokeh i{position:absolute;bottom:0;width:3px;height:3px;border-radius:50%;
    background:#ffe9b0;box-shadow:0 0 6px 2px rgba(255,220,150,.7);animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.45}50%{opacity:1}}
  /* 한강 물 */
  .river{position:absolute;left:0;right:0;top:56%;height:5%;z-index:1;
    background:linear-gradient(180deg,#3d5f92,#294870);opacity:.9}
  .river::after{content:"";position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(90deg,transparent 0 7px, rgba(255,255,255,.18) 7px 9px, transparent 9px 20px)}
  /* 잔디밭 */
  .grass{position:absolute;left:0;right:0;top:60%;bottom:0;z-index:1;
    background:linear-gradient(180deg,#82bb4d 0%, #58982f 32%, #3d7b22 100%)}
  .grass::before{content:"";position:absolute;inset:0;opacity:.4;
    background:repeating-linear-gradient(86deg, rgba(255,255,255,.10) 0 2px, transparent 2px 9px),
               repeating-linear-gradient(94deg, rgba(0,55,0,.18) 0 2px, transparent 2px 12px)}

  .scene{position:absolute;left:50%;top:50%;transform:translate(-50%,-42%);
    width:min(92vw,520px);height:min(70vh,520px);z-index:3}
  /* 잔디 위 네모 돗자리(체크 패턴) */
  .mat{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) rotate(-2deg);
    width:48%;aspect-ratio:1/0.9;border-radius:16px;
    background-color:#efe7d4;
    background-image:
      repeating-linear-gradient(0deg, rgba(196,58,58,.34) 0 16px, transparent 16px 32px),
      repeating-linear-gradient(90deg, rgba(196,58,58,.34) 0 16px, transparent 16px 32px);
    box-shadow:0 20px 30px rgba(18,45,8,.5), inset 0 0 0 6px rgba(255,255,255,.55);z-index:1}

  /* 전신 캐릭터 — 돗자리 둘레에 둘러앉음, 살짝 바운스 */
  .char{position:absolute;transform:translate(-50%,-50%);z-index:4;
    transition:transform .55s cubic-bezier(.2,.8,.3,1);will-change:transform}
  .char img{height:120px;width:auto;display:block;
    filter:drop-shadow(0 8px 6px rgba(0,0,0,.28));
    transform-origin:50% 100%;animation:idle 2.8s ease-in-out infinite}
  @keyframes idle{0%,100%{transform:translateY(0) rotate(-1.5deg)}
    50%{transform:translateY(-4px) rotate(1.5deg)}}
  .char.run img{animation:none}
  @media (max-width:430px){ .char img{height:104px} }

  .card{position:absolute;transform:translate(-50%,-50%);z-index:3;perspective:440px;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
  .card .flip{position:relative;transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.3,.8,.4,1);transform:rotateY(180deg)}
  .card.revealed .flip{transform:rotateY(0deg)}
  .card .front{height:48px;width:auto;display:block;border-radius:5px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .card .back{position:absolute;inset:0;border-radius:5px;transform:rotateY(180deg);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:linear-gradient(135deg,#d65246,#9c2b1e);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.85), inset 0 0 0 4px rgba(0,0,0,.08)}
  .card .back::after{content:"";position:absolute;left:50%;top:50%;width:54%;height:54%;
    transform:translate(-50%,-50%);border-radius:50%;border:2px dashed rgba(255,255,255,.7)}
  @media (max-width:430px){ .card .front{height:42px} }

  .bell{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);
    line-height:0;filter:drop-shadow(0 10px 10px rgba(0,0,0,.4));z-index:5}
  .bell img{width:86px;height:auto;display:block}
  .bell.ring{animation:bellShake .5s ease}
  @keyframes bellShake{0%,100%{transform:translate(-50%,-50%) rotate(0)}
    20%{transform:translate(-50%,-56%) rotate(-16deg)}
    50%{transform:translate(-50%,-52%) rotate(14deg)}
    80%{transform:translate(-50%,-54%) rotate(-8deg)}}
  .hand{position:absolute;left:50%;top:55%;transform:translate(-50%,-160%) scale(0);
    font-size:40px;z-index:6;opacity:0}
  .hand.go{animation:slam .5s ease forwards}
  @keyframes slam{0%{transform:translate(-50%,-210%) scale(.6);opacity:0}
    60%{transform:translate(-50%,-150%) scale(1.1);opacity:1}
    100%{transform:translate(-50%,-88%) scale(1);opacity:1}}

  #fx{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:7;pointer-events:none}
  .flash.go{animation:flash .5s ease}
  @keyframes flash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}

  .hint{position:absolute;left:0;right:0;top:18%;text-align:center;color:var(--muted);
    font-size:14px;letter-spacing:.02em;opacity:0;animation:fadeIn .8s ease .3s forwards}
  @keyframes fadeIn{to{opacity:1}}
  .skip{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:20;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--ink);
    padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer}

  /* ---------------- CONTENT ---------------- */
  #content{opacity:0;transition:opacity 1s ease}
  #content.show{opacity:1}
  .hero{padding:64px 22px 26px;text-align:center;position:relative}
  .hero .eyebrow{color:var(--gold);letter-spacing:.35em;font-size:12px;font-weight:700;margin-bottom:14px}
  .hero h1{font-size:clamp(34px,10vw,52px);margin:0;line-height:1.12;font-weight:900;
    background:linear-gradient(180deg,#fff, #ffe6a8 70%, var(--gold2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 4px 30px rgba(255,180,60,.25)}
  .hero .sub{margin-top:16px;color:var(--muted);font-size:15px}
  .hero .who{margin-top:6px;color:var(--ink);font-size:17px;font-weight:700}


  .card-info{margin:26px 16px;background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:8px 6px;backdrop-filter:blur(6px)}
  .row{display:flex;gap:14px;align-items:flex-start;padding:16px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
  .row:last-child{border-bottom:0}
  .row .ic{font-size:20px;width:26px;text-align:center;flex:none}
  .row .k{font-size:12px;color:var(--muted);letter-spacing:.03em}
  .row .v{font-size:16px;font-weight:600;margin-top:2px}
  .row .v .tbd{color:var(--gold);font-weight:700}
  .maplinks{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .maplinks a{font-size:13px;text-decoration:none;color:#0b1430;background:linear-gradient(var(--gold),var(--gold2));
    padding:7px 12px;border-radius:999px;font-weight:800}
  .maplinks a.alt{color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line)}

  .section-t{text-align:center;margin:40px 0 4px;font-size:13px;letter-spacing:.3em;color:var(--gold);font-weight:700}
  .section-s{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}

  /* ---------------- GUESTBOOK ---------------- */
  .gb{margin:0 16px 40px}
  .gb form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
  .gb input,.gb textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);
    color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;resize:vertical}
  .gb input:focus,.gb textarea:focus{outline:none;border-color:var(--gold)}
  .gb .rowf{display:flex;gap:10px}
  .gb .rowf input{flex:1}
  .gb button.send{background:linear-gradient(var(--gold),var(--gold2));color:#0b1430;border:0;
    font-weight:800;font-size:15px;padding:12px;border-radius:12px;cursor:pointer}
  .gb button.send:disabled{opacity:.5;cursor:default}
  .mode{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
  .list{margin-top:16px;display:grid;gap:10px}
  .entry{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;
    padding:12px 14px;animation:pop .45s cubic-bezier(.2,.8,.3,1)}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .entry .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .entry .nm{font-weight:800;font-size:14px}
  .entry .tm{font-size:11px;color:var(--muted);flex:none}
  .entry .msg{margin-top:5px;font-size:15px;line-height:1.5;color:#e9edf7;white-space:pre-wrap;word-break:break-word}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:22px}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 16px calc(40px + env(safe-area-inset-bottom))}
  .replay{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:8px 16px;font-size:13px;cursor:pointer;margin-top:8px}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important}}
</style>
</head>
<body>

<!-- ===================== INTRO ===================== -->
<div id="intro">
  <div class="skyline"></div>
  <div class="bokeh" id="bokeh"></div>
  <div class="river"></div>
  <div class="grass"></div>
  <div class="hint" id="hint">🃏 뚝섬 한강공원, 죽음의 멀리갈리 한 판이 진행 중…</div>
  <div class="scene" id="scene">
    <div class="mat"></div>
    <div class="bell" id="bell"><img src="bell.png" alt="할리갈리 종"></div>
    <div class="hand" id="hand">🖐️</div>
  </div>
  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>
  <button class="skip" id="skip">건너뛰기 ⏭</button>
</div>

<!-- ===================== CONTENT ===================== -->
<main id="content" class="wrap">
  <section class="hero">
    <div class="eyebrow">INVITATION</div>
    <h1>죽음의<br>멀리갈리</h1>
    <div class="sub">멀리갈리로 갈 때까지 가보기</div>
    <div class="who" id="whoLine">MK와 아이들</div>
  </section>

  <div class="card-info">
    <div class="row"><div class="ic">🗓️</div><div><div class="k">일시</div><div class="v" id="vDate"></div></div></div>
    <div class="row"><div class="ic">📍</div><div style="flex:1">
      <div class="k">장소</div><div class="v" id="vPlace"></div>
      <div class="maplinks" id="mapLinks"></div>
    </div></div>
    <div class="row"><div class="ic">🧥</div><div><div class="k">드레스코드 &amp; 준비물</div><div class="v" id="vDress"></div></div></div>
  </div>

  <div class="section-t">GUESTBOOK</div>
  <div class="section-s">한 마디 남기고 가세요 ✍️</div>
  <div class="gb">
    <form id="gbForm">
      <div class="rowf">
        <input id="gbName" maxlength="20" placeholder="이름/닉네임" autocomplete="off" required />
      </div>
      <textarea id="gbMsg" maxlength="300" rows="3" placeholder="응원, 참석 여부, 아무 말이나…" required></textarea>
      <button class="send" id="gbSend" type="submit">방명록 남기기</button>
      <div class="mode" id="gbMode"></div>
    </form>
    <div class="list" id="gbList"></div>
  </div>

  <footer>
    죽음의 멀리갈리 · 뚝섬 한강공원<br>
    <button class="replay" id="replay">🔔 오프닝 다시 보기</button>
  </footer>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const CFG = window.INVITE_CONFIG;
  const FACES = ["01_man1_left","02_man2_glass","03_man3_center","04_woman_offsh","05_woman_left",
                 "06_woman_pony","07_woman_bang","08_woman_blue","09_woman_smile","10_man4_right",
                 "11_man5_shirt","12_man6_wine"];
  const charPath = f => "chars/"+f+".png";
  const charFacePath = f => "faces_char/"+f+".png";

  /* ---------- preload faces ---------- */
  const imgs = {};   // 폭죽 파티클 = 캐릭터 얼굴
  let loaded = 0;
  FACES.forEach(f=>{
    const im = new Image(); im.src = charFacePath(f);
    im.onload = im.onerror = ()=>{ loaded++; };
    imgs[f]=im;
  });

  /* ---------- city bokeh ---------- */
  const bokeh = document.getElementById('bokeh');
  for(let i=0;i<46;i++){
    const s=document.createElement('i');
    s.style.left=(2+Math.random()*96)+'%';
    s.style.bottom=(Math.random()*22)+'px';
    s.style.animationDelay=(Math.random()*3)+'s';
    const w=2+Math.random()*3; s.style.width=w+'px'; s.style.height=w+'px';
    bokeh.appendChild(s);
  }

  /* ---------- 네모 돗자리 둘레에 전신 캐릭터 배치 ---------- */
  const scene = document.getElementById('scene');
  const seats = [
    {x:30,y:24},{x:50,y:21},{x:70,y:24},   // 위쪽 3명
    {x:15,y:43},{x:14,y:62},{x:18,y:80},   // 왼쪽 3명
    {x:85,y:43},{x:86,y:62},{x:82,y:80},   // 오른쪽 3명
    {x:33,y:84},{x:50,y:87},{x:67,y:84}    // 아래쪽 3명
  ];
  const order = FACES.slice();
  const chars = [];
  order.forEach((id,i)=>{
    const el=document.createElement('div'); el.className='char';
    el.style.left=seats[i].x+'%'; el.style.top=seats[i].y+'%';
    el.innerHTML=`<img src="${charPath(id)}" alt="" style="animation-delay:${(-Math.random()*2.8).toFixed(2)}s">`;
    scene.appendChild(el); chars.push(el);
  });
  // 종 누르는 사람 — 접속할 때마다 랜덤
  let runner = chars[Math.floor(Math.random()*chars.length)];
  // 돗자리 위 할리갈리 카드 (누끼)
  [{x:40,y:48,t:"lime"},{x:60,y:49,t:"straw"},
   {x:44,y:64,t:"plum"},{x:59,y:63,t:"banana"}].forEach(c=>{
    const d=document.createElement('div'); d.className='card';
    d.style.left=c.x+'%'; d.style.top=c.y+'%';
    d.style.transform=`translate(-50%,-50%) rotate(${(-18+Math.random()*36).toFixed(1)}deg)`;
    d.dataset.fruit=c.t;
    d.innerHTML=`<div class="flip"><img class="front" src="cards/${c.t}.png" alt=""><div class="back"></div></div>`;
    scene.appendChild(d);
  });

  /* ---------- fireworks canvas ---------- */
  const cv=document.getElementById('fx'), ctx=cv.getContext('2d');
  let W,H,DPR;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1);
    W=cv.clientWidth||window.innerWidth; H=cv.clientHeight||window.innerHeight;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',resize); resize();

  const parts=[]; const sparks=[];
  const COLORS=['#ffd76b','#ff5d8f','#5ad1ff','#9b7bff','#7CFF9E','#ff8a3d','#fff'];
  function bellPos(){ const b=document.getElementById('bell').getBoundingClientRect();
    return {x:b.left+b.width/2, y:b.top+b.height/2}; }

  function burst(cx,cy,n,power){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=power*(0.5+Math.random());
      parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
        img:imgs[FACES[i%FACES.length]],size:54+Math.random()*44,
        rot:Math.random()*Math.PI, vr:(Math.random()-.5)*0.3,
        life:1,decay:0.006+Math.random()*0.006,ring:COLORS[i%COLORS.length]});
    }
    for(let i=0;i<n*6;i++){
      const a=Math.random()*Math.PI*2, sp=power*(0.6+Math.random()*1.3);
      sparks.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
        life:1,decay:0.012+Math.random()*0.02,c:COLORS[(Math.random()*COLORS.length)|0],r:1.5+Math.random()*2});
    }
  }
  let raf=null, running=false;
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];
      s.vy+=0.05; s.x+=s.vx; s.y+=s.vy; s.life-=s.decay;
      if(s.life<=0){sparks.splice(i,1);continue;}
      ctx.globalAlpha=Math.max(0,s.life); ctx.fillStyle=s.c;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
    }
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];
      p.vy+=0.08; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=p.decay;
      if(p.life<=0||p.y>H+80){parts.splice(i,1);continue;}
      ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.4));
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      // glow ring
      ctx.shadowColor=p.ring; ctx.shadowBlur=18;
      ctx.beginPath();ctx.arc(0,0,p.size/2+2,0,7);
      ctx.strokeStyle=p.ring;ctx.lineWidth=2;ctx.globalAlpha*=.9;ctx.stroke();
      ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.4));
      if(p.img&&p.img.complete) ctx.drawImage(p.img,-p.size/2,-p.size/2,p.size,p.size);
      ctx.restore();
    }
    ctx.globalAlpha=1;
    if(parts.length||sparks.length) raf=requestAnimationFrame(loop);
    else { running=false; }
  }
  function ensureLoop(){ if(!running){running=true; raf=requestAnimationFrame(loop);} }

  /* ---------- timeline ---------- */
  const introEl=document.getElementById('intro');
  const bell=document.getElementById('bell');
  const hand=document.getElementById('hand');
  const flash=document.getElementById('flash');
  let timers=[]; let finished=false; let fireIv=null;
  function T(fn,ms){ timers.push(setTimeout(fn,ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers=[]; if(fireIv){clearInterval(fireIv);fireIv=null;} }

  function fireShow(){
    resize();
    const p=bellPos(); const cx=p.x, cy=p.y;   // 종 위치(정중앙)에서 터짐
    burst(cx,cy,14,7.5);
    let elapsed=0;                              // 3초 동안 연속 폭죽
    fireIv=setInterval(()=>{
      elapsed+=300;
      if(elapsed>=3000){ clearInterval(fireIv); fireIv=null; return; }
      const jx=(Math.random()-.5)*90, jy=(Math.random()-.5)*80;
      burst(cx+jx, cy+jy, 8+Math.floor(Math.random()*5), 6+Math.random()*2.5);
    },300);
    ensureLoop();
  }

  function runSequence(){
    finished=false;
    // 모든 캐릭터 초기화 + 종 누를 사람 랜덤 선택 (접속/다시보기 때마다)
    chars.forEach(c=>{ c.style.transform='translate(-50%,-50%)'; c.classList.remove('run'); c.style.zIndex=''; });
    runner = chars[Math.floor(Math.random()*chars.length)];
    // 카드: 뒷면으로 시작 → 1초 뒤부터 한 장씩 순차적으로 뒤집힘 (순서 랜덤, 단 딸기는 항상 마지막)
    const cardEls=[...document.querySelectorAll('.card')];
    cardEls.forEach(c=>c.classList.remove('revealed'));
    const straw=cardEls.filter(c=>c.dataset.fruit==='straw');
    const others=cardEls.filter(c=>c.dataset.fruit!=='straw');
    for(let i=others.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [others[i],others[j]]=[others[j],others[i]]; }
    [...others,...straw].forEach((c,i)=>{ T(()=>c.classList.add('revealed'), 1000 + i*300); });
    // 2초 대기 후: 랜덤 인물이 종으로 대시
    T(()=>{
      const bp=bellPos();
      const rp=runner.getBoundingClientRect();
      const dx=bp.x-(rp.left+rp.width/2);
      const dy=bp.y-(rp.top+rp.height/2);
      runner.style.transform=`translate(-50%,-50%) translate(${dx}px,${dy-40}px) scale(1.06)`;
    },2000);
    // 손 슬램 + 종 흔들림 + 플래시 + 폭죽
    T(()=>{ hand.classList.add('go'); runner.classList.add('run'); },2560);
    T(()=>{
      bell.classList.add('ring'); flash.classList.add('go');
      document.querySelectorAll('.card').forEach(c=>c.style.animation='none');
      fireShow();
    },2700);
    // 폭죽 3초 후 본문 공개
    T(()=>{ reveal(); },5950);
  }

  function reveal(){
    if(finished) return; finished=true;
    introEl.classList.add('done');
    document.getElementById('content').classList.add('show');
    setTimeout(()=>{ introEl.style.display='none'; }, 900);
  }
  function skip(){ clearTimers(); reveal(); }

  document.getElementById('skip').addEventListener('click',skip);

  function replay(){
    // reset intro
    finished=false; clearTimers();
    parts.length=0; sparks.length=0; ctx.clearRect(0,0,W,H);
    bell.classList.remove('ring'); hand.classList.remove('go'); flash.classList.remove('go');
    runner.classList.remove('run');
    document.querySelectorAll('.card').forEach(c=>c.style.animation='');
    document.getElementById('content').classList.remove('show');
    introEl.style.display=''; introEl.classList.remove('done');
    window.scrollTo(0,0);
    // force reflow to restart CSS anim
    void introEl.offsetWidth;
    runSequence();
  }
  document.getElementById('replay').addEventListener('click',replay);

  // kick off once faces are (mostly) ready
  let started=false;
  function start(){ if(started) return; started=true; runSequence(); }
  const waiter=setInterval(()=>{ if(loaded>=FACES.length){clearInterval(waiter);start();} },80);
  setTimeout(()=>{clearInterval(waiter);start();},1500); // fallback

  /* ============ CONTENT FILL ============ */
  const E=CFG.event;
  document.getElementById('whoLine').textContent=E.host;
  document.getElementById('vDate').innerHTML = E.dateText ? E.dateText : '<span class="tbd">미정 · 추후 공지</span>';
  document.getElementById('vPlace').textContent=E.place;
  document.getElementById('vDress').textContent=E.dress;
  const ml=document.getElementById('mapLinks');
  if(E.mapNaver) ml.insertAdjacentHTML('beforeend',`<a href="${E.mapNaver}" target="_blank" rel="noopener">네이버 지도</a>`);
  if(E.mapGoogle) ml.insertAdjacentHTML('beforeend',`<a class="alt" href="${E.mapGoogle}" target="_blank" rel="noopener">구글 지도</a>`);

  /* ============ GUESTBOOK ============ */
  const S=CFG.supabase;
  const useSupabase = S && S.url && S.anonKey && window.supabase;
  let sb=null;
  if(useSupabase){ sb=window.supabase.createClient(S.url,S.anonKey); }
  const modeEl=document.getElementById('gbMode');
  modeEl.textContent = useSupabase ? '' : '데모 모드 · 지금은 이 브라우저에만 저장됩니다 (Supabase 연결 전)';

  const listEl=document.getElementById('gbList');
  function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function fmt(ts){ try{const d=new Date(ts);
    return `${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }catch(e){return '';} }
  function render(rows){
    if(!rows||!rows.length){ listEl.innerHTML='<div class="empty">아직 방명록이 없어요. 첫 인사를 남겨보세요! 👋</div>'; return; }
    listEl.innerHTML=rows.map(r=>`<div class="entry"><div class="top">
      <span class="nm">${esc(r.nickname)}</span><span class="tm">${fmt(r.created_at)}</span></div>
      <div class="msg">${esc(r.message)}</div></div>`).join('');
  }
  const LS='mgb_entries';
  function localRows(){ try{return JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){return [];} }
  async function load(){
    if(useSupabase){
      const {data,error}=await sb.from(S.table).select('*').order('created_at',{ascending:false}).limit(200);
      if(error){ modeEl.textContent='방명록 불러오기 오류: '+error.message; render(localRows()); return; }
      render(data);
    } else { render(localRows()); }
  }
  document.getElementById('gbForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const nm=document.getElementById('gbName').value.trim();
    const msg=document.getElementById('gbMsg').value.trim();
    if(!nm||!msg) return;
    const btn=document.getElementById('gbSend'); btn.disabled=true; btn.textContent='남기는 중…';
    try{
      if(useSupabase){
        const {error}=await sb.from(S.table).insert({nickname:nm,message:msg});
        if(error) throw error;
      } else {
        const rows=localRows();
        rows.unshift({nickname:nm,message:msg,created_at:new Date().toISOString()});
        localStorage.setItem(LS,JSON.stringify(rows.slice(0,200)));
      }
      document.getElementById('gbMsg').value='';
      await load();
    }catch(err){ alert('저장 실패: '+(err.message||err)); }
    finally{ btn.disabled=false; btn.textContent='방명록 남기기'; }
  });
  load();
})();
</script>
</body>
</html>
